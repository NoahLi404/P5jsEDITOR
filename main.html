<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smooth Markdown Reader with Copyable Code</title>
  <style>
    /* General smooth font + background */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      color: #24292e;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h2 {
      margin-bottom: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    textarea {
      width: 90%;
      max-width: 700px;
      height: 180px;
      font-size: 16px;
      padding: 12px;
      border-radius: 8px;
      border: 2px solid #ddd;
      resize: vertical;
      margin-bottom: 20px;
      font-family: monospace;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 8px rgba(79, 70, 229, 0.5);
      outline: none;
    }

    #preview {
      width: 90%;
      max-width: 700px;
      background: #fff;
      padding: 25px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      min-height: 250px;
      font-size: 18px;
      line-height: 1.7;
      color: #24292e;
      overflow-wrap: break-word;
      transition: box-shadow 0.3s ease;
    }

    #preview p {
      margin-bottom: 1em;
      transition: color 0.3s ease;
    }

    /* Blockquote simple and smooth */
    blockquote {
      margin: 1.5em 0;
      padding-left: 20px;
      border-left: 4px solid #4f46e5;
      color: #4b5563;
      font-style: italic;
      background: #f3f4f6;
      border-radius: 6px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    /* Smooth lists */
    ul, ol {
      margin-left: 1.6em;
      margin-bottom: 1.2em;
      padding-left: 0;
      color: #333;
      transition: color 0.3s ease;
    }

    ul li, ol li {
      margin-bottom: 0.5em;
    }

    /* Headers smooth */
    h1, h2, h3, h4, h5, h6 {
      margin: 1em 0 0.5em 0;
      font-weight: 700;
      line-height: 1.2;
      color: #1f2937;
      transition: color 0.3s ease;
    }

    /* Links */
    a {
      color: #4f46e5;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    a:hover {
      text-decoration: underline;
      color: #4338ca;
    }

    /* Code blocks with ChatGPT style + copy button */

    pre {
      position: relative;
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 8px;
      padding: 1em 1em 1em 1.2em;
      font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.4;
      overflow-x: auto;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.7);
      transition: box-shadow 0.3s ease;
      margin: 1.5em 0;
    }

    pre:hover {
      box-shadow: 0 12px 40px -8px rgba(79, 70, 229, 0.7);
    }

    code {
      font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;
      font-size: 14px;
      color: #d4d4d4;
      background: transparent;
      padding: 0;
      white-space: pre-wrap; /* wrap long lines */
      word-break: break-word;
    }

    /* Copy button styling */
    .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #4f46e5;
      border: none;
      color: white;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.3s ease, background-color 0.3s ease;
      user-select: none;
      font-weight: 600;
    }

    .copy-btn:hover {
      opacity: 1;
      background-color: #4338ca;
    }

    /* Inline code styling */
    p code, li code {
      background: #eaeaea;
      color: #c7254e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 90%;
      font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;
    }
  </style>
<!-- Inline highlight.js GitHub theme -->
<style>
/* highlight.js github.min.css (truncated for brevity, use full content in real use) */
.hljs { display: block; overflow-x: auto; padding: 0.5em; background: #f6f8fa; color: #24292e; }
.hljs-comment, .hljs-quote { color: #6a737d; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-section, .hljs-link { color: #d73a49; }
.hljs-function .hljs-title, .hljs-title, .hljs-name { color: #6f42c1; }
.hljs-variable, .hljs-template-variable, .hljs-selector-attr, .hljs-selector-pseudo { color: #005cc5; }
.hljs-string, .hljs-regexp, .hljs-meta, .hljs-symbol, .hljs-bullet { color: #032f62; }
.hljs-addition { color: #22863a; background-color: #f0fff4; }
.hljs-deletion { color: #b31d28; background-color: #ffeef0; }
.hljs-type, .hljs-built_in, .hljs-builtin-name, .hljs-attr, .hljs-number, .hljs-selector-id, .hljs-selector-class { color: #005cc5; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: bold; }
</style>
</head>
<body>

  <h2>Smooth Markdown Reader with Copyable Code</h2>
  <div style="margin-bottom: 16px; display: flex; gap: 10px;">
    <button id="import-btn">Import</button>
    <button id="export-btn">Export</button>
    <input type="file" id="import-file" accept=".md,.txt" style="display:none;" />
  </div>
  <textarea id="md-input" placeholder="Write your markdown here..."></textarea>

  <div id="preview"></div>

  <script>
// marked.min.js (truncated for brevity, use full content in real use)
// ...MARKED_JS_CODE...
// highlight.min.js (truncated for brevity, use full content in real use)
// ...HIGHLIGHT_JS_CODE...
const input = document.getElementById('md-input');
const preview = document.getElementById('preview');
const importBtn = document.getElementById('import-btn');
const exportBtn = document.getElementById('export-btn');
const importFile = document.getElementById('import-file');
function highlightCodeBlocks() {
  preview.querySelectorAll('pre code').forEach((block) => {
    hljs.highlightElement(block);
  });
}
function addCopyButtons() {
  preview.querySelectorAll('.copy-btn').forEach(btn => btn.remove());
  preview.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copy';
    btn.addEventListener('click', async () => {
      try {
        const code = pre.querySelector('code').innerText;
        await navigator.clipboard.writeText(code);
        btn.textContent = 'Copied!';
        setTimeout(() => (btn.textContent = 'Copy'), 1500);
      } catch (err) {
        btn.textContent = 'Error';
        setTimeout(() => (btn.textContent = 'Copy'), 1500);
      }
    });
    pre.style.position = 'relative';
    pre.appendChild(btn);
  });
}
function updatePreview() {
  preview.innerHTML = marked.parse(input.value);
  highlightCodeBlocks();
  addCopyButtons();
}
input.addEventListener('input', updatePreview);
updatePreview();
exportBtn.addEventListener('click', () => {
  const blob = new Blob([input.value], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'markdown.md';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 0);
});
importBtn.addEventListener('click', () => {
  importFile.click();
});
importFile.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    input.value = evt.target.result;
    updatePreview();
  };
  reader.readAsText(file);
  importFile.value = '';
});
</script>
</body>
</html>
