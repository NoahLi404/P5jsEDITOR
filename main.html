<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Super Smooth Markdown Editor/Previewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg, #f9fafb);
      margin: 0; padding: 0;
      min-height: 100vh;
      color: var(--fg, #24292e);
      transition: background 0.3s, color 0.3s;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      padding: 0 0 32px 0;
      overflow: hidden;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px 0 32px;
    }
    .header h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 16px 32px 0 32px;
      flex-wrap: wrap;
    }
    .toolbar button, .toolbar label {
      background: #f3f4f6;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      color: #4f46e5;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .toolbar button:hover, .toolbar label:hover {
      background: #e0e7ff;
      color: #4338ca;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #e5e7eb;
      margin: 24px 32px 0 32px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px 0;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s, color 0.2s;
      color: #6b7280;
    }
    .tab.active {
      border-bottom: 2.5px solid #4f46e5;
      color: #4f46e5;
      background: #f3f4f6;
    }
    .editor-area, .preview-area {
      display: none;
      padding: 24px 32px 0 32px;
    }
    .editor-area.active, .preview-area.active {
      display: block;
    }
    textarea {
      width: 100%;
      min-height: 260px;
      font-size: 1.1rem;
      padding: 14px;
      border-radius: 8px;
      border: 2px solid #ddd;
      resize: vertical;
      font-family: monospace;
      background: #f9fafb;
      box-shadow: 0 1px 5px rgba(0,0,0,0.07);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    textarea:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 8px rgba(79, 70, 229, 0.2);
      outline: none;
    }
    #preview {
      background: #f9fafb;
      border-radius: 8px;
      min-height: 260px;
      padding: 18px 20px;
      font-size: 1.1rem;
      line-height: 1.7;
      color: #24292e;
      box-shadow: 0 1px 5px rgba(0,0,0,0.07);
      overflow-x: auto;
      transition: background 0.3s, color 0.3s;
    }
    .stats {
      text-align: right;
      font-size: 0.95rem;
      color: #6b7280;
      margin: 8px 32px 0 0;
    }
    .theme-toggle {
      margin-left: 16px;
      cursor: pointer;
      font-size: 1.2rem;
      background: none;
      border: none;
      color: #4f46e5;
      transition: color 0.2s;
    }
    .theme-toggle:hover {
      color: #4338ca;
    }
    @media (max-width: 600px) {
      .container, .header, .toolbar, .tabs, .editor-area, .preview-area {
        padding-left: 8px !important;
        padding-right: 8px !important;
      }
      .header h2 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Super Smooth Markdown Editor</h2>
      <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode">🌙</button>
    </div>
    <div class="toolbar" aria-label="Markdown formatting toolbar">
      <button type="button" data-format="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button type="button" data-format="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button type="button" data-format="code" title="Inline Code (Ctrl+E)">{
